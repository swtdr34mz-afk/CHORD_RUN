# CHORD RUN build settings (fm1-base tools/build.py)
name = "chordrun"               # the build's file names: chordrun-1.5.fwsc, build/host/chordrun_host
title = "CHORD RUN"             # the name people see (firmware hubs)
id_prefix = "FM-1_571"          # package identity: dev FM-1_57100, releases FM-1_571 + XXYYZZ (not Blop's 94)
usb_manufacturer = "swtdr34mz"
usb_product = "CHORD RUN FM-1"   # the USB name (the MIDI port in Ableton)
o2 = ["dsp/engine.c"]           # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]        # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
font_full = ["L"]               # lower case in the big font: chord names (Am7, Cmaj9, sus4)
ble = false
backup = true                   # backup and restore of the settings and the progress (and the resource region's transfer)
resources = "res/piano.bin"     # the grand piano's samples (tools/make_piano.py)
resources_what = "the grand piano's samples"
tagline = "One-finger chord player with a melody voice"
repo = "https://github.com/swtdr34mz-afk/PLOP"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz (based on Blop by Obsimo)"
description = "One-finger chord player: the chords of a song sit on the black keys, the white keys play a melody that follows the chord's scale. 17 song sets, each with its own sounds, tempo and drums; a melody voice with one SPACE knob (reverb and echoes), glide, vibrato and ASSIST (the good notes light up); twelve drum styles (house, trap, phonk, drill, afrobeat, hip hop, dreamcore, angelcore and more); a 4-bar looper to play over; and a runner that runs while you play, with missions and ten characters to unlock. Chords and bass go out as MIDI over USB."
tags = ["chords", "midi", "game"]
install = "https://github.com/swtdr34mz-afk/plop/releases"
screenshot = "site/img/screen-intro.png"
