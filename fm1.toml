# BLOP build settings (fm1-base tools/build.py)
name = "BLOP"
id_prefix = "FM-1_571"          # package identity: dev FM-1_57100, releases FM-1_571 + XXYYZZ (the 94 prefix belonged to the Blop card)
usb_manufacturer = "OSR Records"
usb_product = "Blop FM-1"
o2 = ["dsp/engine.c"]           # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/", "prototype/"]   # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
font_full = ["L"]               # lower case in the big font: chord names (Am7, Cmaj9, sus4)
ble = false
tagline = "One-finger chord player with a melody voice"
repo = "https://github.com/swtdr34mz-afk/plop"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "Tom (based on Blop by Obsimo)"
description = "One-finger chord player: the chords of a song sit on the black keys, the white keys play a melody that follows the chord's scale. 19 song sets, a melody voice with its own reverb, chord rhythms, a bass with riffs and soft drums, and ten runner characters on a neon screen. Chords and bass go out as MIDI over USB."
tags = ["chords", "midi", "game"]
install = "https://github.com/swtdr34mz-afk/plop/releases"
screenshot = "site/img/screen-intro.png"
